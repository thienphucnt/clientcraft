name: Deploy Vietlott QuantMatrix Pro Static Export

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vietlott-cloud-auto-evolver
  cancel-in-progress: false

jobs:
  build-and-deploy-pages:
    name: Build Static Export & Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository (master)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Static Export for GitHub Pages (STATIC_EXPORT=1)
        run: |
          rm -rf .next
          mv src/app/api _api_backup
          STATIC_EXPORT=1 npm run build
          mv _api_backup src/app/api
          touch out/.nojekyll

      - name: Deploy Static Bundle to gh-pages Branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy(argon-evolver): build from master $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
