name: CI & Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Static Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: Build static export
        run: npm run build

      - name: Assert pre-rendered static artifacts
        run: |
          test -f out/index.html || (echo "Missing out/index.html" && exit 1)
          test -f out/sitemap.xml || (echo "Missing out/sitemap.xml" && exit 1)
          test -f out/robots.txt || (echo "Missing out/robots.txt" && exit 1)
          test -f out/tools/image-compressor/index.html || (echo "Missing out/tools/image-compressor/index.html" && exit 1)
          test -f out/tools/json-to-typescript/index.html || (echo "Missing out/tools/json-to-typescript/index.html" && exit 1)
          test -f out/tools/text-privacy-scrubber/index.html || (echo "Missing out/tools/text-privacy-scrubber/index.html" && exit 1)
          echo "All static artifacts verified successfully."

      - name: Run Lighthouse CI Action
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
